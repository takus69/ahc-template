<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>AHC IO Visualizer (Standalone)</title>
<style>
  :root {
    --bg: #f5efe6;
    --panel: rgba(255, 252, 247, 0.92);
    --panel-strong: #fffaf2;
    --text: #2e261e;
    --muted: #766a5e;
    --line: #ded2c1;
    --accent: #1f7a63;
    --accent-dark: #165845;
    --route: #d94c3a;
    --point: #263238;
    --shadow: 0 18px 42px rgba(75, 52, 26, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 28px;
    color: var(--text);
    background:
      radial-gradient(circle at 12% 0%, rgba(255,255,255,0.95), transparent 34%),
      radial-gradient(circle at 86% 12%, rgba(31,122,99,0.12), transparent 30%),
      linear-gradient(145deg, #efe2cf, var(--bg));
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }

  h1 {
    margin: 0 0 22px;
    font-size: 30px;
    letter-spacing: 0.03em;
  }

  #container {
    display: grid;
    grid-template-columns: 360px minmax(620px, 1fr);
    gap: 22px;
    align-items: start;
  }

  #left, #canvas-wrapper {
    background: var(--panel);
    border: 1px solid rgba(122, 96, 66, 0.18);
    border-radius: 24px;
    box-shadow: var(--shadow);
  }

  #left { padding: 18px; }

  #canvas-wrapper {
    flex-grow: 1;
    padding: 18px;
    overflow: auto;
  }

  h3 {
    margin: 18px 0 8px;
    color: var(--text);
    font-size: 15px;
    letter-spacing: 0.04em;
  }

  #left h3:first-child { margin-top: 0; }

  #score-box {
    margin-bottom: 12px !important;
    padding: 16px 18px;
    border: 1px solid rgba(31, 122, 99, 0.18);
    border-radius: 18px;
    background: linear-gradient(160deg, #fffdf9, #f3ede2);
    color: var(--accent) !important;
    font-size: 24px !important;
    font-weight: 800;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
  }

  #turn-slider {
    width: 100%;
    accent-color: var(--accent);
    cursor: pointer;
  }

  #turn-label {
    display: inline-block;
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
  }

  textarea {
    width: 100%;
    min-height: 170px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #fffdf9;
    color: var(--text);
    resize: vertical;
    font-family: Consolas, "Cascadia Code", monospace;
    font-size: 13px;
    line-height: 1.45;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  textarea:focus {
    border-color: rgba(31,122,99,0.55);
    box-shadow: 0 0 0 4px rgba(31,122,99,0.10);
  }

  .turn-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }

  button {
    border: 0;
    border-radius: 14px;
    background: var(--accent-dark);
    color: #fff;
    cursor: pointer;
    font-weight: 800;
    transition: transform 0.12s ease, opacity 0.12s ease, box-shadow 0.12s ease;
  }

  button:hover {
    transform: translateY(-1px);
    opacity: 0.96;
    box-shadow: 0 8px 18px rgba(22, 88, 69, 0.20);
  }

  button.turn-btn {
    width: 100%;
    height: 38px;
    font-size: 18px;
    background: #ded5c7;
    color: var(--text);
  }

  #visualize-btn {
    width: 100%;
    margin-top: 18px;
    padding: 13px 16px;
    font-size: 15px;
  }

  canvas {
    display: block;
    max-width: 100%;
    border: 0;
    border-radius: 20px;
    background: #fffdf9;
    box-shadow: inset 0 0 0 1px rgba(122,96,66,0.16);
  }

  @media (max-width: 1050px) {
    body { padding: 18px; }
    #container { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<h1>AHC IO Visualizer (Standalone)</h1>

<div id="container">
  <div id="left">
    <h3>Turn</h3>
    
    <!-- スコア -->
    <div id="score-box" style="margin-bottom: 6px; font-size: 18px; color: blue;">
      Score: 0 (+0)
    </div>

    <!-- ▼ スライダー -->
    <input id="turn-slider" type="range" min="0" max="0" value="0" />
    <span id="turn-label">Turn: 0</span>

    <!-- ▼ ▲▼ ボタン -->
    <div class="turn-controls">
      <button id="prev-btn" class="turn-btn">▼</button>
      <button id="next-btn" class="turn-btn">▲</button>
    </div>

    <h3>Input</h3>
    <textarea id="input-text" rows="10">
3
20 30
50 100
90 80
    </textarea>

    <h3>Output</h3>
    <textarea id="output-text" rows="10">2 0 1</textarea>

    <button id="visualize-btn">Visualize</button>
  </div>

  <div id="canvas-wrapper">
    <canvas id="canvas" width="600" height="600"></canvas>
  </div>
</div>

<script>
// ==============================
// 1. Input パース（例）
// ==============================
function parseInput(text) {
  const it = text.trim().split(/\s+/).map(Number);
  let idx = 0;

  const N = it[idx++];
  const points = [];
  for (let i = 0; i < N; i++) {
    const x = it[idx++];
    const y = it[idx++];
    points.push({ x, y });
  }

  return { N, points };
}

// ==============================
// 2. Output パース（例）
// ==============================
function parseOutput(text, input) {
  const order = text.trim().split(/\s+/).map(Number);
  return { order };
}

// ==============================
// 3. ターンごとの状態を構築
// ==============================
function buildStates(input, output) {
  const states = [];
  const pts = input.points;
  const ord = output.order;

  let score = 0;

  for (let t = 0; t < ord.length; t++) {
    const partialOrder = ord.slice(0, t + 1);

    let lastDist = 0;
    if (t > 0) {
      const a = pts[ord[t - 1]];
      const b = pts[ord[t]];
      lastDist = Math.hypot(a.x - b.x, a.y - b.y);
      score += lastDist;
    }

    states.push({
      t,
      order: partialOrder,
      score,
      lastDist,
    });
  }
  return states;
}

// ==============================
// 4. ターン描画
// ==============================
function drawTurn(input, state) {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "#fffdf9";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const scale = 5;
  const radius = 12;

  // 点
  ctx.fillStyle = "#263238";
  for (let i = 0; i < input.points.length; i++) {
    const p = input.points[i];
    const cx = p.x * scale;
    const cy = p.y * scale;

    // 円
    ctx.beginPath();
    ctx.fillStyle = "#263238";
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);  // 円弧を描く
    ctx.fill();  // 中を塗りつぶす
    
    // テキスト
    ctx.fillStyle = "white";
    ctx.font = "14px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(i.toString(), cx, cy);
  }

  // 経路
  ctx.strokeStyle = "#d94c3a";
  ctx.lineWidth = 4;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();

  const pts = input.points;
  const ord = state.order;

  if (ord.length > 0) {
    ctx.moveTo(pts[ord[0]].x * scale, pts[ord[0]].y * scale);  // ペンを移動
    for (let i = 1; i < ord.length; i++) {
      ctx.lineTo(pts[ord[i]].x * scale, pts[ord[i]].y * scale);  // 次の点まで線を描く
    }
  }

  ctx.stroke();  // 描写
}

// ==============================
// 5. スライダー + ▲▼ ボタン設定
// ==============================
function setupSlider(states, input) {
  const slider = document.getElementById("turn-slider");
  const label = document.getElementById("turn-label");
  const scoreBox = document.getElementById("score-box");
  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");

  slider.min = 0;
  slider.max = states.length - 1;
  slider.value = 0;

  function updateTurn(t) {
    slider.value = t;
    label.textContent = "Turn: " + t;

    const st = states[t];
    scoreBox.textContent =
      `Score: ${st.score.toFixed(2)} (+${st.lastDist.toFixed(2)})`;

    drawTurn(input, st);
  }

  slider.oninput = () => {
    updateTurn(Number(slider.value));
  };

  prevBtn.onclick = () => {
    let t = Number(slider.value);
    if (t > 0) updateTurn(t - 1);
  };

  nextBtn.onclick = () => {
    let t = Number(slider.value);
    if (t < states.length - 1) updateTurn(t + 1);
  };

  // 初期描画
  updateTurn(0);
}

// ==============================
// 6. Visualize ボタン
// ==============================
document.getElementById("visualize-btn").addEventListener("click", () => {
  const inputText = document.getElementById("input-text").value;
  const outputText = document.getElementById("output-text").value;

  if (!inputText || !outputText) {
    alert("Input と Output を両方貼り付けてください");
    return;
  }

  try {
    const input = parseInput(inputText);
    const output = parseOutput(outputText, input);

    const states = buildStates(input, output);
    setupSlider(states, input);

  } catch (e) {
    console.error(e);
    alert("パースに失敗しました。フォーマットを確認してください。");
  }
});
</script>

</body>
</html>
